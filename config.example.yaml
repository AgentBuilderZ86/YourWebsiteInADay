# Configuration YourWebsiteInADay.
# Les secrets (mots de passe, clés API) se passent par variables d'environnement, jamais ici.

business:
  name: "YourWebsiteInADay"
  sender_name: "AZ"
  sender_email: "azriouil.az@gmail.com"
  phone: "+212 6 62 45 81 51"
  whatsapp: "212662458151"
  # Site vitrine de l'offre (page d'accueil du site Netlify des maquettes)
  website: "https://yourwebsiteinaday.netlify.app"
  # Les maquettes sont publiées sous <mockup_base_url>/<slug>/
  mockup_base_url: "https://yourwebsiteinaday.netlify.app/demo"
  # Adresse postale de l'expéditeur : OBLIGATOIRE pour les États-Unis (CAN-SPAM) et le Canada (LCAP/CASL).
  # Tant qu'elle est vide, les marchés marqués requires_postal_address ne reçoivent aucun email.
  postal_address: ""

