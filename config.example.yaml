prospecting:
  sources: ["osm"]
  # Catégories : tag OpenStreetMap, valeur commerciale (poids dans la priorisation), offre conseillée
  categories:
    hotel: { osm: "tourism=hotel", value: 1.5, tier: premium, fr: "hôtel", en: "hotel" }
    dentist: { osm: "amenity=dentist", value: 1.5, tier: standard, fr: "cabinet dentaire", en: "dental practice" }
    estate_agent: { osm: "office=estate_agent", value: 1.4, tier: standard, fr: "agence immobilière", fr_art: "une", en: "real estate agency" }
    restaurant: { osm: "amenity=restaurant", value: 1.2, tier: standard, fr: "restaurant", en: "restaurant" }
    beauty: { osm: "shop=beauty", value: 1.2, tier: standard, fr: "institut de beauté", en: "beauty salon" }
    hairdresser: { osm: "shop=hairdresser", value: 1.1, tier: standard, fr: "salon de coiffure", en: "hair salon" }
    optician: { osm: "shop=optician", value: 1.1, tier: standard, fr: "opticien", en: "optician" }
    florist: { osm: "shop=florist", value: 1.0, tier: premium, fr: "fleuriste", en: "florist" }
    clothes: { osm: "shop=clothes", value: 1.0, tier: premium, fr: "boutique", fr_art: "une", en: "boutique" }
    car_repair: { osm: "shop=car_repair", value: 1.0, tier: basique, fr: "garage", en: "auto repair shop" }
    bakery: { osm: "shop=bakery", value: 0.9, tier: basique, fr: "boulangerie", fr_art: "une", en: "bakery" }
    cafe: { osm: "amenity=cafe", value: 0.8, tier: basique, fr: "café", en: "café" }
    # Métiers reçus par import (ex. dossiers Devanture) : hors rotation de découverte automatique
    bar: { osm: "amenity=bar", value: 0.9, tier: basique, fr: "bar", en: "bar", discover: false }
    fast_food: { osm: "amenity=fast_food", value: 0.8, tier: basique, fr: "snack", en: "takeaway", discover: false }
    pharmacy: { osm: "amenity=pharmacy", value: 1.2, tier: standard, fr: "pharmacie", fr_art: "une", en: "pharmacy", discover: false }
    wine_shop: { osm: "shop=alcohol", value: 1.0, tier: standard, fr: "cave à vins", fr_art: "une", en: "wine shop", discover: false }
    deli: { osm: "shop=deli", value: 1.0, tier: standard, fr: "traiteur", en: "deli", discover: false }
    cheese: { osm: "shop=cheese", value: 1.0, tier: standard, fr: "fromagerie", fr_art: "une", en: "cheese shop", discover: false }
    jewelry: { osm: "shop=jewelry", value: 1.2, tier: premium, fr: "bijouterie", fr_art: "une", en: "jeweller", discover: false }
    antiques: { osm: "shop=antiques", value: 1.0, tier: premium, fr: "antiquaire", en: "antiques shop", discover: false }
    furniture: { osm: "shop=furniture", value: 1.1, tier: premium, fr: "magasin de meubles", en: "furniture store", discover: false }
    gift: { osm: "shop=gift", value: 0.9, tier: premium, fr: "boutique de cadeaux", fr_art: "une", en: "gift shop", discover: false }
    stationery: { osm: "shop=stationery", value: 0.9, tier: basique, fr: "papeterie", fr_art: "une", en: "stationery shop", discover: false }
    collector: { osm: "shop=collector", value: 0.9, tier: premium, fr: "boutique de collection", fr_art: "une", en: "collectors' shop", discover: false }
    music: { osm: "shop=music", value: 0.9, tier: premium, fr: "disquaire", en: "record shop", discover: false }
    tattoo: { osm: "shop=tattoo", value: 1.1, tier: standard, fr: "salon de tatouage", en: "tattoo studio", discover: false }
    travel_agency: { osm: "shop=travel_agency", value: 1.2, tier: standard, fr: "agence de voyages", fr_art: "une", en: "travel agency", discover: false }
    upholsterer: { osm: "craft=upholsterer", value: 1.1, tier: standard, fr: "tapissier-décorateur", en: "upholsterer", discover: false }
    copyshop: { osm: "shop=copyshop", value: 0.8, tier: basique, fr: "imprimerie", fr_art: "une", en: "print shop", discover: false }
    video: { osm: "shop=video", value: 0.7, tier: basique, fr: "vidéoclub", en: "video store", discover: false }
    soap: { osm: "shop=beauty", value: 1.0, tier: premium, fr: "savonnerie", fr_art: "une", en: "soap shop", discover: false }
    carpenter: { osm: "craft=carpenter", value: 1.2, tier: standard, fr: "menuisier", en: "carpenter", discover: false }
  # Nombre de combinaisons (marché, ville, catégorie) explorées par exécution — tournantes
  combos_per_run: 6
  max_leads_per_run: 80
  # Les commerces sans site ne sont gardés que s'ils ont un email public (sinon injoignables)
  include_no_website: true

audit:
  timeout_seconds: 15
  bad_site_threshold: 60
  # Site correct (note ≥ seuil) mais peu lisible par Google et les IA : offre « Audit GEO » seule
  geo_offer: true
  geo_threshold: 50
  use_pagespeed: false

pricing:
  # Comparaison agences (markets.<code>.benchmarks : [bas, haut, délai?] en devise locale).
  # Sources (sept. 2026) — FR : ipaoo.fr (agence 1 000–6 000 €), fenxi.fr (vitrine 2 000–6 000 € HT, 2–5 sem. ; e-commerce 4 000–20 000 €
  # HT, 4–12 sem.), audit GEO : vigeon.fr / lafabriquedunet.fr (1 500–3 000 €). MA : mumtaz.ma (vitrine
  # simple 3 000–8 000, pro 8 000–25 000, e-commerce 15 000–60 000 MAD), audit SEO : pulsemarketing.ma /
  # toprank.ma (audit 1 500–4 000 MAD ; SEO PME 3 000–8 000 MAD/mois). AU : wolfiq.com.au. AE : codingclave.com (AED 8 000–35 000).
  # Offres GEO (correctifs / optimisation) déductibles d'une refonte commandée sous `geo_credit_days` jours.
  geo_credit_days: 30
  # Offre seule « Audit GEO » (commerces au site correct mais peu visible pour Google et les IA) :
  # prix par marché dans markets.<code>.prices.geo
  geo_audit:
    label: { fr: "Audit GEO complet", en: "Full GEO audit" }
    delivery: { fr: "48 h", en: "48 hours" }
    features:
      fr: ["Analyse de vos pages clés et de votre fiche Google", "Comparaison avec 3 concurrents locaux", "Cohérence de vos coordonnées sur Google, Facebook, TripAdvisor et annuaires", "Plan d'action priorisé, prêt à confier à votre prestataire", "Échange de 30 min pour le présenter"]
      en: ["Review of your key pages and Google Business Profile", "Benchmark against 3 local competitors", "Consistency of your details across Google, Facebook, TripAdvisor and directories", "Prioritised action plan, ready to hand to your web provider", "30-minute call to walk you through it"]
  # Offres GEO « mise en œuvre » (marchés qui les listent dans markets.<code>.geo_offers)
  geo_fix:
    label: { fr: "Correctifs GEO prioritaires", en: "Priority GEO fixes" }
    delivery: { fr: "72 h", en: "72 hours" }
    features:
      fr: ["Correction des failles les plus pénalisantes relevées dans votre audit", "Données structurées « commerce local », horaires et coordonnées lisibles par Google et les IA", "Robots IA autorisés et fichier llms.txt", "Score SEO & GEO remesuré après intervention, preuve à l'appui"]
      en: ["Fix of the most damaging issues found in your audit", "Local-business structured data, hours and contact details readable by Google and AI", "AI crawlers allowed and llms.txt file", "SEO & GEO score re-measured after the work, with proof"]
  geo_full:
    label: { fr: "Optimisation GEO complète", en: "Full GEO optimisation" }
    delivery: { fr: "7 jours", en: "7 days" }
    features:
      fr: ["Toutes les recommandations de votre audit mises en place", "FAQ rédigée et balisée, fiche Google optimisée", "Coordonnées harmonisées sur Google, Facebook, TripAdvisor et annuaires", "Comparaison avec 3 concurrents locaux", "Score SEO & GEO remesuré après intervention, preuve à l'appui"]
      en: ["Every recommendation from your audit implemented", "FAQ written and marked up, Google profile optimised", "Details aligned across Google, Facebook, TripAdvisor and directories", "Benchmark against 3 local competitors", "SEO & GEO score re-measured after the work, with proof"]
  tiers:
    basique:
      label: { fr: "Basique — Site vitrine express", en: "Starter — Express one-page site" }
      delivery: { fr: "24 h", en: "24 hours" }
      features:
        fr: ["Site one-page responsive (mobile d'abord)", "Horaires, adresse, carte, téléphone, WhatsApp", "HTTPS + hébergement 1 an inclus", "Fiche Google Business reliée", "Bases GEO : données structurées schema.org + FAQ pour être compris par Google et les IA"]
        en: ["Mobile-first one-page website", "Hours, address, map, phone, WhatsApp", "HTTPS + 1 year hosting included", "Google Business Profile linked", "GEO basics: schema.org structured data + FAQ so Google and AI assistants understand you"]
    standard:
      label: { fr: "Standard — Site professionnel", en: "Business — Professional website" }
      delivery: { fr: "72 h", en: "72 hours" }
      features:
        fr: ["Tout le Basique", "Jusqu'à 5 pages", "Prise de rendez-vous / réservation", "Audit SEO & GEO complet et mise en œuvre de toutes les recommandations", "Optimisation pour les assistants IA (ChatGPT, Perplexity, Gemini) : FAQ, llms.txt, robots IA", "Rédaction des textes incluse"]
        en: ["Everything in Starter", "Up to 5 pages", "Online booking / appointments", "Full SEO & GEO audit with every recommendation implemented", "AI-assistant optimisation (ChatGPT, Perplexity, Gemini): FAQ, llms.txt, AI crawlers", "Copywriting included"]
    premium:
      label: { fr: "Premium — Sur-mesure & vente en ligne", en: "Premium — Custom site & online sales" }
      delivery: { fr: "7 jours", en: "7 days" }
      features:
        fr: ["Tout le Standard", "Boutique ou réservation avec paiement", "Design sur-mesure", "Multilingue", "Suivi mensuel de visibilité Google & IA (SEO + GEO)"]
        en: ["Everything in Business", "Online shop or paid bookings", "Custom design", "Multilingual", "Monthly Google & AI visibility tracking (SEO + GEO)"]

outreach:
  # queue : les emails sont mis en file ; Claude les envoie via Gmail (`ywiad queue`, puis `ywiad confirm`)
  # smtp  : envoi direct par SMTP (SMTP_PASSWORD en variable d'environnement)
  mode: queue
  # Plafond quotidien (premiers contacts + relances). Gmail perso : rester bas pour protéger la réputation.
  daily_send_limit: 25
  # Heures locales du destinataire pendant lesquelles on envoie (jours ouvrés uniquement)
  send_window: [8, 18]
  # Jours d'envoi (0 = lundi … 6 = dimanche) : les commerçants travaillent le samedi
  send_weekdays: [0, 1, 2, 3, 4, 5]
  followup_days: [2, 5, 10]
  smtp:
    host: "smtp.gmail.com"
    port: 587
    username: "azriouil.az@gmail.com"
  imap:
    enabled: false
    host: "imap.gmail.com"
    port: 993
    username: "azriouil.az@gmail.com"

paths:
  database: "data/ywiad.sqlite"
  mockups: "out/site/demo"
  site: "out/site"
  outbox: "out/outbox"
  reports: "out/reports"
