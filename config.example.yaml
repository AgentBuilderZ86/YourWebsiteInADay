prospecting:
  sources: ["osm"]
  # Catégories : tag OpenStreetMap, valeur commerciale (poids dans la priorisation), offre conseillée
  categories:
    hotel: { osm: "tourism=hotel", value: 1.5, tier: premium, fr: "hôtel", en: "hotel" }
    dentist: { osm: "amenity=dentist", value: 1.5, tier: standard, fr: "cabinet dentaire", en: "dental practice" }
    estate_agent: { osm: "office=estate_agent", value: 1.4, tier: standard, fr: "agence immobilière", en: "real estate agency" }
    restaurant: { osm: "amenity=restaurant", value: 1.2, tier: standard, fr: "restaurant", en: "restaurant" }
    beauty: { osm: "shop=beauty", value: 1.2, tier: standard, fr: "institut de beauté", en: "beauty salon" }
    hairdresser: { osm: "shop=hairdresser", value: 1.1, tier: standard, fr: "salon de coiffure", en: "hair salon" }
    optician: { osm: "shop=optician", value: 1.1, tier: standard, fr: "opticien", en: "optician" }
    florist: { osm: "shop=florist", value: 1.0, tier: premium, fr: "fleuriste", en: "florist" }
    clothes: { osm: "shop=clothes", value: 1.0, tier: premium, fr: "boutique", en: "boutique" }
    car_repair: { osm: "shop=car_repair", value: 1.0, tier: basique, fr: "garage", en: "auto repair shop" }
    bakery: { osm: "shop=bakery", value: 0.9, tier: basique, fr: "boulangerie", en: "bakery" }
    cafe: { osm: "amenity=cafe", value: 0.8, tier: basique, fr: "café", en: "café" }
  # Nombre de combinaisons (marché, ville, catégorie) explorées par exécution — tournantes
  combos_per_run: 6
  max_leads_per_run: 80
  # Les commerces sans site ne sont gardés que s'ils ont un email public (sinon injoignables)
  include_no_website: true

audit:
  timeout_seconds: 15
  bad_site_threshold: 60
  use_pagespeed: false

pricing:
  tiers:
    basique:
      label: { fr: "Basique — Site vitrine express", en: "Starter — Express one-page site" }
      delivery: { fr: "24 h", en: "24 hours" }
      features:
        fr: ["Site one-page responsive (mobile d'abord)", "Horaires, adresse, carte, téléphone, WhatsApp", "HTTPS + hébergement 1 an inclus", "Fiche Google Business reliée"]
        en: ["Mobile-first one-page website", "Hours, address, map, phone, WhatsApp", "HTTPS + 1 year hosting included", "Google Business Profile linked"]
    standard:
      label: { fr: "Standard — Site professionnel", en: "Business — Professional website" }
      delivery: { fr: "72 h", en: "72 hours" }
      features:
        fr: ["Tout le Basique", "Jusqu'à 5 pages", "Prise de rendez-vous / réservation", "SEO local avancé", "Rédaction des textes incluse"]
        en: ["Everything in Starter", "Up to 5 pages", "Online booking / appointments", "Advanced local SEO", "Copywriting included"]
    premium:
      label: { fr: "Premium — Sur-mesure & vente en ligne", en: "Premium — Custom site & online sales" }
      delivery: { fr: "7 jours", en: "7 days" }
      features:
        fr: ["Tout le Standard", "Boutique ou réservation avec paiement", "Design sur-mesure", "Multilingue", "Rapport mensuel de performance"]
        en: ["Everything in Business", "Online shop or paid bookings", "Custom design", "Multilingual", "Monthly performance report"]

outreach:
  # queue : les emails sont mis en file ; Claude les envoie via Gmail (`ywiad queue`, puis `ywiad confirm`)
  # smtp  : envoi direct par SMTP (SMTP_PASSWORD en variable d'environnement)
  mode: queue
  # Plafond quotidien (premiers contacts + relances). Gmail perso : rester bas pour protéger la réputation.
  daily_send_limit: 25
  # Heures locales du destinataire pendant lesquelles on envoie (jours ouvrés uniquement)
  send_window: [8, 18]
  followup_days: [3, 7, 14]
  smtp:
    host: "smtp.gmail.com"
    port: 587
    username: "azriouil.az@gmail.com"
  imap:
    enabled: false
    host: "imap.gmail.com"
    port: 993
    username: "azriouil.az@gmail.com"

paths:
  database: "data/ywiad.sqlite"
  mockups: "out/site/demo"
  site: "out/site"
  outbox: "out/outbox"
  reports: "out/reports"
