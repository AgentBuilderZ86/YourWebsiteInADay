<!doctype html>
<html lang="{{ lang }}" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>{{ subject }}</title>
<style>
  body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
  a { text-decoration: none; }
  @media (max-width: 620px) {
    .container { width: 100% !important; }
    .px { padding-left: 22px !important; padding-right: 22px !important; }
    .h1 { font-size: 26px !important; line-height: 32px !important; }
    .score { font-size: 48px !important; line-height: 48px !important; }
    .hide-sm { display: none !important; }
    .stack { display: block !important; width: 100% !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; background:{{ c.bg }};">
<div style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:{{ c.bg }};">{{ preheader }}&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:{{ c.bg }};">
  <tr>
    <td align="center" style="padding:28px 12px 40px;">
      <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px;">
        <!-- En-tête -->
        <tr>
          <td class="px" style="padding:0 8px 18px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="font-family:{{ f.serif }}; font-size:19px; color:{{ c.ink }}; letter-spacing:-0.2px;">
                  <a href="{{ business.website }}" style="color:{{ c.ink }};">YourWebsite<span style="color:{{ c.accent }};">InADay</span></a>
                </td>
                <td align="right" class="hide-sm" style="font-family:{{ f.sans }}; font-size:12px; color:{{ c.muted }}; letter-spacing:0.3px;">{{ s.tagline }}</td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Carte principale -->
        <tr>
          <td style="background:{{ c.card }}; border-radius:18px; border:1px solid {{ c.line }};">
            {% block content %}{% endblock %}
          </td>
        </tr>
        <!-- Pied -->
        <tr>
          <td class="px" style="padding:22px 16px 0; font-family:{{ f.sans }}; font-size:11px; line-height:17px; color:{{ c.faint }};">
            {{ market.legal }}{% if business.postal_address and market.requires_postal_address %}<br>{{ business.name }}, {{ business.postal_address }}{% endif %}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
