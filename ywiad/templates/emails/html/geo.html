{% extends "emails/html/_layout.html" %}
{% block content %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td class="px" style="padding:34px 40px 8px; font-family:{{ f.sans }}; font-size:15px; line-height:24px; color:{{ c.ink }};">
      {% for p in paragraphs %}<p style="margin:0 0 14px;">{{ p }}</p>{% endfor %}
    </td>
  </tr>
  {% if audit_url %}
  <tr>
    <td class="px" style="padding:6px 40px 10px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:{{ c.soft }}; border-radius:14px;">
        <tr>
          <td valign="middle" width="92" style="padding:16px 0 16px 18px; font-family:{{ f.serif }}; font-size:40px; line-height:40px; color:{{ c.danger if (geo_score or 0) < 40 else c.warn }};">{{ geo_score }}<span style="font-size:14px; color:{{ c.muted }};">/100</span></td>
          <td valign="middle" style="padding:14px 18px; font-family:{{ f.sans }};">
            <span style="font-size:11px; letter-spacing:1.6px; text-transform:uppercase; color:{{ c.accent }};">{{ s.geo_kicker }}</span><br>
            <span style="font-family:{{ f.serif }}; font-size:18px; line-height:24px; color:{{ c.ink }};">{{ s.geo_title }}</span><br>
            <a href="{{ audit_url }}" style="font-size:14px; font-weight:600; color:{{ c.ink }}; text-decoration:underline;">{{ s.geo_cta }} &rarr;</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  {% endif %}
  <tr>
    <td class="px" style="padding:18px 40px 34px;">
      {% include "emails/html/_signature.html" %}
    </td>
  </tr>
</table>
{% endblock %}
